name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # TODO: pin to verified SHA
      - uses: actions/setup-node@v4 # TODO: pin to verified SHA
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
